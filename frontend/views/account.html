<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account · NutriCart SmartPantry</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="app-nav"></header>
  <main>
    <div class="page-head">
      <div>
        <h1>My Account</h1>
      </div>
    </div>
    <div class="card">
      <form id="profile-form" novalidate>
        <div class="row">
          <label>Name <input name="name" required maxlength="100"></label>
          <label>Email <input name="email" type="email" required maxlength="100"></label>
        </div>
        <div class="row" style="margin-top:.6rem">
          <label>Weekly grocery budget ($) <input name="weekly_budget_limit" type="number" min="0" step="0.01" required></label>
          <label>Daily calorie target <span class="hint">e.g. 2000</span>
            <input name="target_calories" type="number" min="1" max="20000" step="1"></label>
        </div>
        <h3>Change password <span class="hint">(leave empty to keep your current password)</span></h3>
        <div class="row">
          <label>New password <input name="password" type="password" minlength="8" maxlength="100" autocomplete="new-password"></label>
          <label>Confirm new password <input name="confirm" type="password" autocomplete="new-password"></label>
        </div>
        <div class="form-actions"><button class="btn" type="submit">Save</button></div>
      </form>
    </div>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/account.js"></script>
</body>
</html>
